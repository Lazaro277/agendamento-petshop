<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo Pet</title>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700&family=Inter:wght@500;700&display=swap"
    rel="stylesheet">
  <!-- BootStrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- BootStrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <!-- CSS -->
  <link rel="stylesheet" href="src/styles/index.css">
  <!-- JavaScript -->
  <script src="src/js/scripts.js" defer></script>
</head>

<body>
  <h1 id="logo">Mundo Pet</h1>

  <main class="container">

    <h2 class="text-white fs-1 mt-3 fw-semibold">Sua agenda</h2>
    <p class="text-secondary fw-semibold">Aqui você pode ver todos os clientes e serviços agendados para hoje</p>

    <div class="wrapper-inDate" role="button" tabindex="0" aria-label="Selecionar data">
      <img src="src/assets/icons/Calendar-Minimalistic--Streamline-Solar.svg" alt="">
      <input id="appointment-date" type="date">
      <img src="src/assets/icons/arrow-down.svg" alt="">
    </div>

    <div id="period-morning">
      <div class="period-header">

        <img src="src/assets/icons/Sun-Fog--Streamline-Solar.svg" alt="">

        <h4>Manhã</h4>

        <span>09h-12h</span>

      </div>

    </div>
  </main>

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/90b19570b9.js" crossorigin="anonymous"></script>
</body>

</html>
