<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo Pet</title>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700&family=Inter:wght@500;700&display=swap"
    rel="stylesheet">
  <!-- BootStrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- BootStrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
  <h1 id="logo">Mundo Pet</h1>

  <main class="container">

    <div id="page-header">

      <header>
        <h2 class="text-white fs-1 mt-3 fw-semibold">Sua agenda</h2>
        <p class="text-secondary fw-semibold">Aqui você pode ver todos os clientes e serviços agendados para hoje</p>
      </header>

      <div class="wrapper-inDate" role="button" tabindex="0" aria-label="Selecionar data">
        <img src="src/assets/icons/calendar.svg" alt="Calendário">
        <input id="appointment-date" type="date">
        <img src="src/assets/icons/arrow-down.svg" alt="Abrir seletor">
      </div>

    </div>

    <div class="period" id="period-morning">
      <div class="period-header">
        <img src="src/assets/icons/sun.svg" alt="Sol">
        <h4>Manhã</h4>
        <span>09h-12h</span>
      </div>

      <div class="period-body">
      </div>

    </div>

    <div class="period" id="period-afternoon">
      <div class="period-header">
        <img src="src/assets/icons/cloud.svg" alt="Nuvem">
        <h4>Tarde</h4>
        <span>13h-18h</span>
      </div>

      <div class="period-body">
      </div>

    </div>

    <div class="period" id="period-night">
      <div class="period-header">
        <img src="src/assets/icons/moon.svg" alt="Lua">
        <h4>Noite</h4>
        <span>19h-21h</span>
      </div>

      <div class="period-body">
      </div>

    </div>

    <div id="new-scheduling-container">
      <button id="new-scheduling-button" class="btn-default">Novo Agendamento</button>
    </div>
  </main>


  <div id="modal-new-scheduling" class="modal-hide">

    <div id="modal-body">
      <img src="src/assets/icons/close.svg" alt="Fechar janela" id="close-modal">


      <h2 class="text-white fs-1 mt-3 fw-semibold">Agende um atendimento</h2>
      <p class="text-secondary fw-semibold">Preencha os dados do cliente para realizar o agendamento:</p>

      <form>
        <div class="wrapper-inText">
          <img src="src/assets/icons/user.svg" alt="Tutor">
          <input id="schedule-tutor-name" type="text" placeholder="João Gustavo">
        </div>

        <label for="schedule-pet-name">Nome do pet</label>
        <div class="wrapper-inText">
          <img src="src/assets/icons/pet-paw.svg" alt="Pet">
          <input id="schedule-pet-name" type="text" placeholder="Akira">
        </div>

        <label for="schedule-tutor-number">Telefone</label>
        <div class="wrapper-inText">
          <img src="src/assets/icons/phone.svg" alt="Telefone">
          <input id="schedule-tutor-number" type="text" placeholder="(99) 9 9999-9999">
        </div>

        <label for="schedule-description">Descrição do serviço</label>
        <div class="wrapper-inText">
          <textarea name="schedule-description" id="schedule-description" placeholder="Banho e tosa"></textarea>
        </div>

        <label for="schedule-date">Data</label>
        <div class="wrapper-inDate" role="button" tabindex="0" aria-label="Selecionar data">
          <img src="src/assets/icons/calendar.svg" alt="Calendário">
          <input id="schedule-date" type="date">
          <img src="src/assets/icons/arrow-down.svg" alt="Abrir seletor">
        </div>

        <label for="schedule-time">Hora</label>
        <div class="wrapper-inTime">
          <img src="src/assets/icons/clock.svg" alt="Relógio">
          <select id="schedule-time" aria-label="Selecionar hora" disabled></select>
          <img src="src/assets/icons/arrow-down.svg" alt="Abrir seletor">
        </div>


        <button type="submit" id="new-scheduling-button" class="btn-default">Agendar</button>

      </form>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="liveToast" class="toast position-absolute top-0 start-50 translate-middle-x mt-3 rounded-3" role="alert"
    aria-live="assertive" aria-atomic="true" style="z-index: 1060;">
    <div>
      <div class="toast-body text-white" id="toast-body">
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
        aria-label="Close"></button>
    </div>
  </div>


  <!-- Toast confirm -->
  <div id="toastConfirm" class="toast" role="alert" aria-live="assertive" aria-atomic="true" style="z-index: 1060;">
    <div class="toast-body">
      <span id="toast-confirm-message"></span>
      <div class="mt-2 pt-2 border-top border-secondary">
        <button type="button" class="btn btn-success btn-sm" data-bs-dismiss="toast" id="btn-confirm">Excluir</button>
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="toast" id="btn-cancel">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/90b19570b9.js" crossorigin="anonymous"></script>
</body>

</html>
